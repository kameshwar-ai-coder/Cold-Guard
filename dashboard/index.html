<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7f2">
  <title>ColdGuard | Cold-chain intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>
  <section class="login-screen" id="login-screen">
    <div class="login-panel">
      <div class="brand login-brand"><span class="brand-mark">+</span><span>coldguard</span></div>
      <div class="eyebrow">Cold-chain intelligence</div>
      <h1 id="auth-heading">Sign in to your workspace</h1>
      <p class="subtle" id="auth-description">Use your account email and password to continue.</p>
      <form id="login-form">
        <div id="registration-fields" class="hidden">
          <label for="account-name">Your name</label>
          <input id="account-name" name="name" type="text" autocomplete="name" placeholder="Enter your name">
          <label for="account-role">Account type</label>
          <select id="account-role" name="role">
            <option value="pharmacy">Pharmacy</option>
            <option value="transport">Transport team</option>
          </select>
        </div>
        <label for="account-email">Work email</label>
        <input id="account-email" name="email" type="email" autocomplete="username" placeholder="name@company.com" required>
        <label for="account-password">Password</label>
        <input id="account-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        <p class="form-error" id="auth-error" role="alert"></p>
        <button class="button login-submit" id="auth-submit" type="submit">Sign in <span>→</span></button>
      </form>
      <button class="auth-mode-toggle" data-action="auth-mode" type="button">Create an account</button>
    </div>
  </section>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">+</span><span>coldguard</span></div>
      <div class="workspace-label">Workspace</div>
      <div class="workspace-role" id="workspace-role">Workspace</div>
      <nav id="primary-nav" aria-label="Primary navigation"></nav>
      <div class="sidebar-foot">
        <div class="connection-dot"><span></span><span id="connection-label">Connecting to API</span></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="Open menu">☰</button>
        <div>
          <p class="eyebrow" id="page-kicker">Transport operations</p>
          <h1 id="page-title">Control tower</h1>
        </div>
        <div class="topbar-actions"><button class="sound-toggle" data-action="sound" aria-pressed="false">🔇 Sound
            off</button><span class="live-pill"><span></span> Live monitoring</span><button class="icon-button"
            aria-label="Notifications">♧</button>
          <div class="top-profile"><button class="profile-trigger" data-action="profile"
              aria-label="Open profile menu"><span class="profile-name" id="top-profile-name">User</span><span
                class="avatar avatar-large" id="top-avatar">--</span></button>
            <div class="profile-menu" id="profile-menu">
              <div class="profile-menu-name" id="profile-menu-name">User</div><button data-action="logout">Log
                out</button>
            </div>
          </div>
        </div>
      </header>
      <div id="toast" class="toast" role="status"></div>
      <section id="page-content" class="page-content"></section>
    </main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>

</html>
